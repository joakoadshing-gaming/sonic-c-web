<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic CD Web</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #pantalla-carga {
            text-align: center;
            width: 80%;
            max-width: 400px;
        }
        #barra-fondo {
            width: 100%;
            height: 20px;
            background-color: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }
        #barra-progreso {
            width: 0%;
            height: 100%;
            background-color: #0066ff;
            transition: width 0.2s;
        }
        #contenedor-juego {
            display: none;
            width: 800px;
            height: 600px;
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>

    <div id="pantalla-carga">
        <h2 id="texto-estado">Cargando Sonic CD (0/17)...</h2>
        <div id="barra-fondo">
            <div id="barra-progreso"></div>
        </div>
    </div>

    <div id="contenedor-juego">
        <div id="game"></div>
    </div>

    <script>
        const TOTAL_PARTES = 17;
        const RUTA_VIRTUAL = "roms/SonicCD.chd";

        async function descargarYUnir() {
            const textoEstado = document.getElementById("texto-estado");
            const barraProgreso = document.getElementById("barra-progreso");
            const fragmentos = [];

            try {
                for (let i = 1; i <= TOTAL_PARTES; i++) {
                    const num = String(i).padStart(3, "0");
                    const url = `roms/sonic.part${num}`;
                    const respuesta = await fetch(url);
                    if (!respuesta.ok) {
                        throw new Error(`Error al descargar ${url}`);
                    }
                    const buffer = await respuesta.arrayBuffer();
                    fragmentos.push(buffer);

                    const porcentaje = Math.round((i / TOTAL_PARTES) * 100);
                    textoEstado.textContent = `Cargando Sonic CD (${i}/${TOTAL_PARTES}) - ${porcentaje}%`;
                    barraProgreso.style.width = `${porcentaje}%`;
                }

                textoEstado.textContent = "Preparando emulador...";
                const blobUnido = new Blob(fragmentos, { type: "application/octet-stream" });
                const arrayBufferFinal = await blobUnido.arrayBuffer();

                // Interceptar fetch para entregar el archivo virtual terminado en .chd
                const fetchOriginal = window.fetch;
                window.fetch = async function(recurso, opciones) {
                    const urlStr = typeof recurso === "string" ? recurso : (recurso && recurso.url ? recurso.url : "");
                    if (urlStr.includes(RUTA_VIRTUAL)) {
                        return new Response(arrayBufferFinal, {
                            status: 200,
                            statusText: "OK",
                            headers: {
                                "Content-Type": "application/octet-stream",
                                "Content-Length": arrayBufferFinal.byteLength.toString()
                            }
                        });
                    }
                    return fetchOriginal.apply(this, arguments);
                };

                // Interceptar XMLHttpRequest por si el nucleo lo usa en lugar de fetch
                const xhrOpenOriginal = XMLHttpRequest.prototype.open;
                const xhrSendOriginal = XMLHttpRequest.prototype.send;

                XMLHttpRequest.prototype.open = function(metodo, url) {
                    this._esRomVirtual = typeof url === "string" && url.includes(RUTA_VIRTUAL);
                    return xhrOpenOriginal.apply(this, arguments);
                };

                XMLHttpRequest.prototype.send = function(cuerpo) {
                    if (this._esRomVirtual) {
                        Object.defineProperty(this, "status", { writable: true, value: 200 });
                        Object.defineProperty(this, "readyState", { writable: true, value: 4 });
                        Object.defineProperty(this, "response", { writable: true, value: arrayBufferFinal });
                        Object.defineProperty(this, "responseText", { writable: true, value: "" });
                        setTimeout(() => {
                            if (typeof this.onreadystatechange === "function") this.onreadystatechange();
                            if (typeof this.onload === "function") this.onload();
                        }, 10);
                        return;
                    }
                    return xhrSendOriginal.apply(this, arguments);
                };

                document.getElementById("pantalla-carga").style.display = "none";
                document.getElementById("contenedor-juego").style.display = "block";

                window.EJS_player = "#game";
                window.EJS_core = "segaCD";
                window.EJS_gameName = "Sonic CD (USA).chd";
                window.EJS_gameUrl = RUTA_VIRTUAL;
                window.EJS_biosUrl = "bios/bios_CD_U.bin";
                window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
                window.EJS_language = "es-ES";
                window.EJS_startOnLoaded = true;

                const scriptLoader = document.createElement("script");
                scriptLoader.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
                document.body.appendChild(scriptLoader);

            } catch (error) {
                textoEstado.textContent = "Error al cargar las partes del juego: " + error.message;
                textoEstado.style.color = "#ff4444";
            }
        }

        descargarYUnir();
    </script>
</body>
</html>
