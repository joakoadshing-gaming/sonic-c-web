<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic CD Web Online (EmulatorJS)</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #contenedor-juego {
            width: 800px;
            height: 600px;
            max-width: 100vw;
            max-height: 100vh;
            display: none;
        }
        #pantalla-carga {
            text-align: center;
            width: 80%;
            max-width: 400px;
        }
        .barra-fondo {
            width: 100%;
            height: 20px;
            background-color: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }
        #barra-progreso {
            width: 0%;
            height: 100%;
            background-color: #0078ff;
            transition: width 0.2s;
        }
    </style>
</head>
<body>

    <div id="pantalla-carga">
        <h2 id="texto-estado">Preparando Sonic CD...</h2>
        <div class="barra-fondo">
            <div id="barra-progreso"></div>
        </div>
        <p id="texto-detalle">0 / 17 partes descargadas</p>
    </div>

    <div id="contenedor-juego">
        <div id="game"></div>
    </div>

    <script>
        const TOTAL_PARTES = 17;
        const RUTA_VIRTUAL = "roms/SonicCD.chd";
        let romBuffer = null;

        async function descargarYUnir() {
            const barra = document.getElementById("barra-progreso");
            const estado = document.getElementById("texto-estado");
            const detalle = document.getElementById("texto-detalle");
            const trozos = [];
            let tamanoTotal = 0;

            try {
                for (let i = 1; i <= TOTAL_PARTES; i++) {
                    const num = String(i).padStart(3, '0');
                    const url = `roms/sonic.part${num}`;
                    const respuesta = await fetch(url);
                    if (!respuesta.ok) {
                        throw new Error(`Error al descargar ${url} (HTTP ${respuesta.status})`);
                    }
                    const buffer = await respuesta.arrayBuffer();
                    trozos.push(new Uint8Array(buffer));
                    tamanoTotal += buffer.byteLength;

                    const porcentaje = Math.round((i / TOTAL_PARTES) * 100);
                    barra.style.width = porcentaje + "%";
                    detalle.textContent = `${i} / ${TOTAL_PARTES} partes descargadas (${porcentaje}%)`;
                }

                estado.textContent = "Uniendo archivos en memoria...";
                const combinado = new Uint8Array(tamanoTotal);
                let offset = 0;
                for (const trozo of trozos) {
                    combinado.set(trozo, offset);
                    offset += trozo.byteLength;
                }
                romBuffer = combinado.buffer;

                instalarInterceptores();
                iniciarEmulador();

            } catch (error) {
                estado.textContent = "Error al cargar los archivos";
                estado.style.color = "#ff4444";
                detalle.textContent = error.message;
                console.error(error);
            }
        }

        function instalarInterceptores() {
            const fetchOriginal = window.fetch;
            window.fetch = async function(input, init) {
                const urlStr = (typeof input === "string") ? input : (input && input.url ? input.url : "");
                if (urlStr.includes(RUTA_VIRTUAL)) {
                    return new Response(romBuffer, {
                        status: 200,
                        statusText: "OK",
                        headers: {
                            "Content-Type": "application/octet-stream",
                            "Content-Length": romBuffer.byteLength.toString()
                        }
                    });
                }
                return fetchOriginal.apply(this, arguments);
            };

            const XHROpenOriginal = XMLHttpRequest.prototype.open;
            const XHRSendOriginal = XMLHttpRequest.prototype.send;

            XMLHttpRequest.prototype.open = function(method, url) {
                this._esRomVirtual = (typeof url === "string" && url.includes(RUTA_VIRTUAL));
                return XHROpenOriginal.apply(this, arguments);
            };

            XMLHttpRequest.prototype.send = function(body) {
                if (this._esRomVirtual) {
                    setTimeout(() => {
                        Object.defineProperty(this, "status", { get: () => 200 });
                        Object.defineProperty(this, "statusText", { get: () => "OK" });
                        Object.defineProperty(this, "readyState", { get: () => 4 });
                        Object.defineProperty(this, "response", { get: () => romBuffer });
                        Object.defineProperty(this, "responseType", { get: () => "arraybuffer" });
                        if (typeof this.onreadystatechange === "function") this.onreadystatechange();
                        if (typeof this.onload === "function") this.onload();
                    }, 10);
                    return;
                }
                return XHRSendOriginal.apply(this, arguments);
            };
        }

        function iniciarEmulador() {
            document.getElementById("pantalla-carga").style.display = "none";
            document.getElementById("contenedor-juego").style.display = "block";

            window.EJS_player = "#game";
            window.EJS_core = "genesis_plus_gx";
            window.EJS_gameName = "Sonic CD (USA).chd";
            window.EJS_gameUrl = RUTA_VIRTUAL;
            window.EJS_biosUrl = "bios/bios_CD_U.bin";
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            window.EJS_language = "es-ES";
            window.EJS_startOnLoaded = true;

            const script = document.createElement("script");
            script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            document.body.appendChild(script);
        }

        descargarYUnir();
    </script>
</body>
</html>
